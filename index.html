<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Atividades - Planner</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Agenda de Atividades</h1>
            <p class="subtitle">Organize e planeje suas atividades</p>
        </header>

        <div class="controls">
            <button id="addTaskBtn" class="btn btn-primary">+ Nova Atividade</button>
            <div class="filters">
                <select id="filterPriority">
                    <option value="all">Todas as Prioridades</option>
                    <option value="high">Alta</option>
                    <option value="medium">Média</option>
                    <option value="low">Baixa</option>
                </select>
                <select id="filterStatus">
                    <option value="all">Todos os Status</option>
                    <option value="pending">Pendente</option>
                    <option value="in-progress">Em Progresso</option>
                    <option value="completed">Concluída</option>
                </select>
            </div>
        </div>

        <div class="board">
            <div class="column" data-status="pending">
                <div class="column-header">
                    <h2>📝 Pendente</h2>
                    <span class="task-count" id="pending-count">0</span>
                </div>
                <div class="tasks-container" id="pending-tasks"></div>
            </div>

            <div class="column" data-status="in-progress">
                <div class="column-header">
                    <h2>🔄 Em Progresso</h2>
                    <span class="task-count" id="in-progress-count">0</span>
                </div>
                <div class="tasks-container" id="in-progress-tasks"></div>
            </div>

            <div class="column" data-status="completed">
                <div class="column-header">
                    <h2>✅ Concluída</h2>
                    <span class="task-count" id="completed-count">0</span>
                </div>
                <div class="tasks-container" id="completed-tasks"></div>
            </div>
        </div>
    </div>

    <!-- Modal para Adicionar/Editar Atividade -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Nova Atividade</h2>
                <span class="close">&times;</span>
            </div>
            <form id="taskForm">
                <div class="form-group">
                    <label for="taskTitle">Título da Atividade*</label>
                    <input type="text" id="taskTitle" required>
                </div>

                <div class="form-group">
                    <label for="taskDescription">Descrição</label>
                    <textarea id="taskDescription" rows="4"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskDueDate">Data de Vencimento</label>
                        <input type="date" id="taskDueDate">
                    </div>

                    <div class="form-group">
                        <label for="taskPriority">Prioridade*</label>
                        <select id="taskPriority" required>
                            <option value="low">Baixa</option>
                            <option value="medium" selected>Média</option>
                            <option value="high">Alta</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="taskStatus">Status*</label>
                    <select id="taskStatus" required>
                        <option value="pending" selected>Pendente</option>
                        <option value="in-progress">Em Progresso</option>
                        <option value="completed">Concluída</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="taskCategory">Categoria</label>
                    <input type="text" id="taskCategory" placeholder="Ex: Trabalho, Pessoal, Estudos">
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
